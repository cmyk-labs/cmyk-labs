name: Update profile READMEs

on:
  schedule:
    # Daily at 08:00 Beijing time (UTC+8), equivalent to 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/profile.config.json"
      - ".github/profile/README.template.md"
      - ".github/profile/sections/**"
      - ".github/workflows/update-profile.yml"
      - "scripts/update-profile.mjs"
      - "scripts/update-profile.test.mjs"

permissions:
  contents: write

concurrency:
  group: update-profile-readme
  cancel-in-progress: true

jobs:
  update:
    if: github.repository == 'cmyk-labs/cmyk-labs'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check bilingual profile generation
        run: node --test scripts/update-profile.test.mjs

      - name: Refresh profile data
        run: node scripts/update-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated profile
        shell: bash
        run: |
          if git diff --quiet -- README.md README.zh-CN.md && [ -z "$(git ls-files --others --exclude-standard -- README.md README.zh-CN.md)" ]; then
            echo "Profile READMEs are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md
          git commit -m "chore(profile): refresh profile data"
          git push
