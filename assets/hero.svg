<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>cmyk-labs — Building with AI, LLMs, Agents, Deep Learning, and Python</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#BDEEFF" stroke-opacity="0.055" />
    </pattern>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00EFFF" />
      <stop offset="0.52" stop-color="#7C5CFF" />
      <stop offset="1" stop-color="#FF39C6" />
    </linearGradient>
    <radialGradient id="coreGlow">
      <stop stop-color="#EEF8FF" stop-opacity="0.24" />
      <stop offset="0.35" stop-color="#00EFFF" stop-opacity="0.11" />
      <stop offset="1" stop-color="#05070B" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="topHalf"><rect x="54" y="114" width="490" height="80" /></clipPath>
    <clipPath id="bottomHalf"><rect x="54" y="194" width="490" height="96" /></clipPath>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .orbit-c { transform-origin: 865px 210px; animation: spin 20s linear infinite; }
      .orbit-m { transform-origin: 865px 210px; animation: spinBack 14s linear infinite; }
      .orbit-y { transform-origin: 865px 210px; animation: spin 10s linear infinite; }
      .node { animation: nodePulse 3.2s ease-in-out infinite; }
      .node:nth-of-type(2) { animation-delay: -0.8s; }
      .node:nth-of-type(3) { animation-delay: -1.6s; }
      .node:nth-of-type(4) { animation-delay: -2.4s; }
      .scan { animation: scan 5.6s ease-in-out infinite; }
      .ghost-c { animation: driftC 4.8s ease-in-out infinite; }
      .ghost-m { animation: driftM 4.8s ease-in-out infinite; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinBack { to { transform: rotate(-360deg); } }
      @keyframes nodePulse { 0%,100% { opacity:.42; } 50% { opacity:1; } }
      @keyframes scan { 0%,100% { transform: translateY(-50px); opacity:0; } 15%,85% { opacity:.55; } 50% { transform: translateY(500px); } }
      @keyframes driftC { 0%,100% { transform:translate(-4px,2px); } 50% { transform:translate(-8px,3px); } }
      @keyframes driftM { 0%,100% { transform:translate(5px,-2px); } 50% { transform:translate(10px,-4px); } }
      @keyframes blink { 0%,48% { opacity:1; } 49%,100% { opacity:0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="460" rx="14" fill="#05070B" />
  <rect x="0.5" y="0.5" width="1199" height="459" rx="13.5" stroke="url(#edge)" stroke-opacity="0.48" />
  <rect width="1200" height="460" rx="14" fill="url(#grid)" />
  <rect x="555" y="0" width="645" height="460" fill="url(#coreGlow)" />

  <path d="M24 58V24H58" stroke="#00EFFF" />
  <path d="M24 58V24H58" stroke="#FF39C6" transform="translate(4 4)" />
  <path d="M1142 436H1176V402" stroke="#F0FF5A" />
  <path d="M1142 436H1176V402" stroke="#00EFFF" transform="translate(-4 -4)" />

  <g opacity="0.4">
    <path d="M600 54H1166" stroke="#BDEEFF" stroke-opacity="0.16" />
    <path d="M600 406H1166" stroke="#BDEEFF" stroke-opacity="0.16" />
    <path d="M615 36V424" stroke="#BDEEFF" stroke-opacity="0.12" />
  </g>

  <text x="58" y="62" class="mono" fill="#00EFFF" font-size="12" letter-spacing="3.4">INDEPENDENT AI BUILDER / NODE 25.08</text>
  <circle cx="508" cy="57" r="4" fill="#F0FF5A" filter="url(#glow)" />
  <text x="522" y="62" class="mono" fill="#A3B0C0" font-size="11" letter-spacing="2">SYSTEMS ONLINE</text>

  <g class="sans" font-size="132" font-weight="700" letter-spacing="-8">
    <text x="58" y="252" fill="#00EFFF" fill-opacity="0.66" clip-path="url(#topHalf)" class="ghost-c">CMYK</text>
    <text x="58" y="252" fill="#FF39C6" fill-opacity="0.72" clip-path="url(#bottomHalf)" class="ghost-m">CMYK</text>
    <text x="58" y="252" fill="#05070B" stroke="#EEF8FF" stroke-width="1.4">CMYK</text>
  </g>
  <text x="68" y="300" class="mono" fill="#EEF8FF" font-size="32" font-weight="600" letter-spacing="22">LABS</text>

  <path d="M58 330H540" stroke="#BDEEFF" stroke-opacity="0.14" />
  <text x="58" y="365" class="mono" fill="#F0FF5A" font-size="18">&gt;<tspan class="cursor">_</tspan></text>
  <text x="94" y="365" class="mono" fill="#EEF8FF" font-size="16" letter-spacing="0.5">Building with AI · LLMs · Agents · Deep Learning · Python</text>
  <text x="58" y="409" class="mono" fill="#718095" font-size="10" letter-spacing="2.2">RESEARCH → PROTOTYPE → SHIP → ITERATE</text>

  <g>
    <circle cx="865" cy="210" r="186" stroke="#BDEEFF" stroke-opacity="0.08" />
    <circle cx="865" cy="210" r="144" stroke="#BDEEFF" stroke-opacity="0.1" stroke-dasharray="2 8" />
    <path d="M659 210H1071M865 4V416" stroke="#BDEEFF" stroke-opacity="0.1" />
    <path d="M700 74L1030 346M700 346L1030 74" stroke="#BDEEFF" stroke-opacity="0.06" />

    <g class="orbit-c">
      <circle cx="865" cy="210" r="166" stroke="#00EFFF" stroke-width="1.5" stroke-dasharray="505 538" />
      <circle class="node" cx="702" cy="242" r="4" fill="#00EFFF" filter="url(#glow)" />
    </g>
    <g class="orbit-m">
      <circle cx="865" cy="210" r="133" stroke="#FF39C6" stroke-width="1.5" stroke-dasharray="340 496" />
      <circle class="node" cx="990" cy="164" r="4" fill="#FF39C6" filter="url(#glow)" />
    </g>
    <g class="orbit-y">
      <circle cx="865" cy="210" r="101" stroke="#F0FF5A" stroke-width="1.5" stroke-dasharray="246 389" />
      <circle class="node" cx="807" cy="127" r="4" fill="#F0FF5A" filter="url(#glow)" />
    </g>
    <circle cx="865" cy="210" r="67" fill="#05070B" stroke="#EEF8FF" stroke-opacity="0.26" />
    <circle cx="865" cy="210" r="50" fill="#EEF8FF" />
    <text x="865" y="205" class="mono" fill="#05070B" font-size="13" font-weight="700" text-anchor="middle">AI</text>
    <text x="865" y="222" class="mono" fill="#05070B" font-size="10" font-weight="600" letter-spacing="2" text-anchor="middle">CORE</text>
  </g>

  <g class="mono" font-size="10" letter-spacing="2">
    <rect x="647" y="94" width="90" height="28" stroke="#00EFFF" stroke-opacity="0.3" fill="#05070B" />
    <circle cx="647" cy="94" r="3" fill="#00EFFF" />
    <text x="665" y="112" fill="#00EFFF">LLM</text>
    <rect x="1025" y="139" width="106" height="28" stroke="#FF39C6" stroke-opacity="0.3" fill="#05070B" />
    <circle cx="1131" cy="167" r="3" fill="#FF39C6" />
    <text x="1042" y="157" fill="#FF39C6">AGENT</text>
    <rect x="1009" y="320" width="116" height="28" stroke="#F0FF5A" stroke-opacity="0.3" fill="#05070B" />
    <circle cx="1125" cy="348" r="3" fill="#F0FF5A" />
    <text x="1025" y="338" fill="#F0FF5A">D.LEARN</text>
    <rect x="652" y="338" width="112" height="28" stroke="#EEF8FF" stroke-opacity="0.24" fill="#05070B" />
    <circle cx="652" cy="366" r="3" fill="#EEF8FF" />
    <text x="669" y="356" fill="#EEF8FF">PYTHON</text>
  </g>

  <g class="mono" font-size="9" letter-spacing="1.5" fill="#718095">
    <text x="1070" y="77">CALIBRATION</text>
    <text x="1070" y="94" fill="#EEF8FF">CMYK / RGB</text>
    <text x="1070" y="111">PROTOCOL</text>
    <text x="1070" y="128" fill="#EEF8FF">OPEN</text>
  </g>

  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#00EFFF" opacity="0.35" />
</svg>
